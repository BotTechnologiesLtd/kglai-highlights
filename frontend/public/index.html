<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGL AI Highlights</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Football-themed subtle background */
      background: url('https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* dark overlay to improve text readability */
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      color: #2e7d32;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin: 20px 0;
    }

    button {
      background: #2e7d32;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1b5e20;
    }

    video {
      width: 100%;
      border-radius: 10px;
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>⚽ KGL AI Highlights</h1>
    <p>Upload your football match and download AI-generated highlights (max 3 minutes)</p>
    
    <input type="file" id="videoUpload" accept="video/*" />
    <br>
    <button onclick="processVideo()">Upload & Process</button>
    
    <p id="status" class="hidden">⏳ Processing highlights...</p>
    
    <video id="preview" class="hidden" controls></video>
    <br>
    <a id="downloadBtn" class="hidden" download="kglai_highlights.mp4">
      <button>⬇️ Download Highlights</button>
    </a>
  </div>

  <script>
    function processVideo() {
      const fileInput = document.getElementById("videoUpload");
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!fileInput.files[0]) {
        alert("Please select a video first!");
        return;
      }

      status.classList.remove("hidden");
      status.innerText = "⏳ Processing highlights...";

      // Simulated processing for GitHub Pages (no real backend here)
      setTimeout(() => {
        status.innerText = "✅ Highlights ready!";
        preview.src = URL.createObjectURL(fileInput.files[0]);
        preview.classList.remove("hidden");
        downloadBtn.href = preview.src;
        downloadBtn.classList.remove("hidden");
      }, 3000);
    }
  </script>
</body>
</html>
